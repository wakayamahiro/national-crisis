<body>
<div id="app">
  <div class="title-row">
    <h1>国家危機（仮）</h1>
    <div class="sub">半協力・正体隠匿・交渉ゲーム</div>
  </div>

  <div id="root"></div>
</div>

<script>
/* =====================================================================
   1. データ定義
   ===================================================================== */
const RESOURCE_TYPES = ['oil','water','iron','food'];
const RESOURCE_LABEL = {oil:'石油', water:'水', iron:'鉄', food:'食料'};
const RESOURCE_COLOR = {oil:'var(--oil)', water:'var(--water)', iron:'var(--iron)', food:'var(--food)'};

const CRISIS_DEFS = [
  {type:'war',       name:'戦争',        reqType:'oil',   reqAmount:2, count:5},
  {type:'drought',   name:'干ばつ',      reqType:'water', reqAmount:2, count:4},
  {type:'famine',    name:'飢饉',        reqType:'food',  reqAmount:2, count:4},
  {type:'infra',     name:'インフラ崩壊', reqType:'iron',  reqAmount:2, count:3},
  {type:'emergency', name:'国家非常事態', reqType:'any',   reqAmount:4, count:2},
];

let _idc = 0;
function nid(prefix){ return prefix+'_'+(_idc++); }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildCrisisDeck(){
  const deck=[];
  CRISIS_DEFS.forEach(def=>{ for(let i=0;i<def.count;i++) deck.push({id:nid('crisis'), type:def.type, name:def.name, reqType:def.reqType, reqAmount:def.reqAmount}); });
  return shuffle(deck);
}
function buildResourcePool(){
  const pool=[];
  RESOURCE_TYPES.forEach(t=>{ for(let i=0;i<10;i++) pool.push({id:nid('res'), type:t}); });
  return shuffle(pool);
}
function clone(s){ return JSON.parse(JSON.stringify(s)); }

/* =====================================================================
   2. ゲームエンジン（純関数）
   ===================================================================== */
const Game2 = {};
function pushLog(state,msg){ state.log.push(msg); if(state.log.length>300) state.log.shift(); }

Game2.newGame = function(names, gaugeMax){
  gaugeMax = gaugeMax || 5;
  const roles = shuffle(['citizen','citizen','citizen','traitor']);
  const pool = buildResourcePool();
  const players = names.map((name,i)=>({ id:i, name, role:roles[i], hand: pool.splice(0,5) }));
  const crisisDeck = buildCrisisDeck();
  const state = {
    players, turnPlayer:0, crisisDeck, currentCrisis:null, gauge:0, gaugeMax,
    discard:[], refillDeck:[], field:[], submissions:{}, zeroSubmitters:[],
    round:1, phase:'crisis_reveal', result:null, log:['ゲーム開始'],
  };
  state.currentCrisis = state.crisisDeck.shift();
  pushLog(state, `第${state.round}ラウンド: 「${state.currentCrisis.name}」が発生`);
  return state;
};
Game2.advanceToDiscussion = function(stateIn){
  const state=clone(stateIn); if(state.phase!=='crisis_reveal') return state;
  state.phase='discussion'; return state;
};
Game2.advanceToSubmission = function(stateIn){
  const state=clone(stateIn); if(state.phase!=='discussion') return state;
  state.phase='submission'; state.submissions={}; return state;
};
Game2.submitCards = function(stateIn, playerId, cardIds){
  const state=clone(stateIn); if(state.phase!=='submission') return state;
  if(state.submissions[playerId]) return state;
  const player = state.players[playerId];
  for(const cid of cardIds){ if(!player.hand.find(c=>c.id===cid)) return state; }
  const removed=[];
  player.hand = player.hand.filter(c=>{ if(cardIds.includes(c.id)){ removed.push(c); return false; } return true; });
  state.submissions[playerId]=removed;
  if(Game2.allSubmitted(state)) return Game2.revealSubmissions(state);
  return state;
};
Game2.allSubmitted = function(state){ return state.players.every(p=>state.submissions[p.id]); };
Game2.revealSubmissions = function(stateIn){
  const state=clone(stateIn); if(state.phase!=='submission') return state;
  if(!Game2.allSubmitted(state)) return state;
  const field=[], zero=[];
  state.players.forEach(p=>{
    const cards = state.submissions[p.id]||[];
    if(cards.length===0) zero.push(p.id);
    cards.forEach(c=> field.push({id:c.id, type:c.type, ownerId:p.id, traded:false}));
  });
  state.field=field; state.zeroSubmitters=zero; state.submissions={}; state.phase='reveal';
  pushLog(state, `提出完了（${field.length}枚が公開）`);
  return state;
};
Game2.advanceToTrade = function(stateIn){
  const state=clone(stateIn); if(state.phase!=='reveal') return state;
  state.phase='trade'; return state;
};
Game2.doTrade = function(stateIn, cardId1, cardId2, newType){
  const state=clone(stateIn); if(state.phase!=='trade') return state;
  if(cardId1===cardId2) return state;
  const c1=state.field.find(c=>c.id===cardId1), c2=state.field.find(c=>c.id===cardId2);
  if(!c1||!c2) return state;
  if(!RESOURCE_TYPES.includes(newType)) return state;
  state.field = state.field.filter(c=>c.id!==cardId1 && c.id!==cardId2);
  state.field.push({id:nid('res'), type:newType, ownerId:null, traded:true});
  pushLog(state, `貿易: ${RESOURCE_LABEL[c1.type]}+${RESOURCE_LABEL[c2.type]} → ${RESOURCE_LABEL[newType]}（2枚消費・1枚生成）`);
  return state;
};
Game2.advanceToJudgment = function(stateIn){
  const state=clone(stateIn); if(state.phase!=='trade') return state;
  state.phase='judgment'; return state;
};
Game2.canSucceed = function(state){
  const req=state.currentCrisis;
  if(req.reqType==='any') return state.field.length>=req.reqAmount;
  return state.field.filter(c=>c.type===req.reqType).length>=req.reqAmount;
};
Game2.resolveSuccess = function(stateIn, chosenIds){
  const state=clone(stateIn); if(state.phase!=='judgment') return state;
  const req=state.currentCrisis;
  if(chosenIds.length!==req.reqAmount) return state;
  const chosenCards = chosenIds.map(id=>state.field.find(c=>c.id===id));
  if(chosenCards.some(c=>!c)) return state;
  if(req.reqType!=='any' && chosenCards.some(c=>c.type!==req.reqType)) return state;
  const chosenSet = new Set(chosenIds);
  chosenCards.forEach(c=> state.discard.push(c.type));
  const remaining = state.field.filter(c=>!chosenSet.has(c.id));
  remaining.forEach(c=> state.refillDeck.push(c.type));
  state.refillDeck = shuffle(state.refillDeck);
  state.field=[];
  pushLog(state, `「${req.name}」解決に成功！`);
  return finishRound(state);
};
Game2.resolveFailure = function(stateIn){
  const state=clone(stateIn); if(state.phase!=='judgment') return state;
  state.gauge += 1;
  const traded = state.field.filter(c=>c.traded);
  const original = state.field.filter(c=>!c.traded);
  traded.forEach(c=> state.discard.push(c.type));
  original.forEach(c=> state.refillDeck.push(c.type));
  state.refillDeck = shuffle(state.refillDeck);
  state.field=[];
  pushLog(state, `「${state.currentCrisis.name}」解決に失敗… 危機ゲージ+1（現在${state.gauge}）`);
  return finishRound(state);
};
function finishRound(state){
  const order=[state.turnPlayer,(state.turnPlayer+1)%4,(state.turnPlayer+2)%4,(state.turnPlayer+3)%4];
  const target = order.find(pid=>state.zeroSubmitters.includes(pid));
  if(target!==undefined && state.refillDeck.length>0){
    const type = state.refillDeck.pop();
    state.players[target].hand.push({id:nid('res'), type});
    pushLog(state, `${state.players[target].name} が補充した（内容は非公開）`);
  } else {
    pushLog(state, '補充なし');
  }
  state.turnPlayer = (state.turnPlayer+1)%4;
  if(state.gauge>=state.gaugeMax){
    state.phase='gameover'; state.result={winner:'traitor', reason:'gauge_max'};
    pushLog(state, `危機ゲージが${state.gaugeMax}に到達。裏切り者の勝利。`);
    return state;
  }
  if(state.crisisDeck.length===0){
    state.phase='gameover'; state.result={winner:'citizen', reason:'all_cleared'};
    pushLog(state, '全ての危機カードを処理。国民の勝利。');
    return state;
  }
  state.round += 1;
  state.currentCrisis = state.crisisDeck.shift();
  state.phase='crisis_reveal';
  pushLog(state, `第${state.round}ラウンド: 「${state.currentCrisis.name}」が発生`);
  return state;
}

/* =====================================================================
   3. Firebase 初期化（オンライン対戦用）
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCHiPbAERMR--X8C_jfu-S9ALETc0DmybU",
  authDomain: "sea-solt2.firebaseapp.com",
  projectId: "sea-solt2",
  storageBucket: "sea-solt2.firebasestorage.app",
  messagingSenderId: "267993560136",
  appId: "1:267993560136:web:c1f2a8d75a7b22baf6d47d",
  measurementId: "G-1MDDE3GN49"
};
let fbReady=false, db=null;
try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey!=="YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    fbReady = true;
  }
}catch(e){ console.error('Firebase init failed', e); }
const CRISIS_COLLECTION = 'rooms'; // 麻雀と同じ rooms コレクションを共用（ルームコードが被る確率はごく低いため許容）

/* =====================================================================
   4. アプリ状態・共通描画パーツ
   ===================================================================== */
const App = {
  mode:null,             // 'hotseat' | 'online'
  gs:null,               // hotseat 用ローカル state
  roleGateIdx:0, roleAcked:[false,false,false,false],
  subGateActor:null, subRevealed:false, subSel:[],
  tradeSel:[], judgeSel:[],
  // online
  myUid: 'u_' + Math.random().toString(36).slice(2,10),
  myName:'', roomCode:null, roomUnsub:null, roomDoc:null, mySeat:-1,
};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const root = document.getElementById('root');
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderStart(){
  root.innerHTML='';
  root.appendChild(el(`
    <div class="card">
      <h2>国家危機（仮）</h2>
      <p class="muted small">4人固定・半協力の正体隠匿ゲームです。国民3人・裏切り者1人が自動でランダムに割り当てられます。</p>
      <button class="btn primary block" id="go-online">オンラインで対戦する（別々の端末）</button>
      <button class="btn block" id="go-hotseat">この端末で4人プレイ（ホットシート）</button>
      <div class="center" style="margin-top:10px;">
        <span class="help-toggle" id="toggle-rules">ルール・役職を見る</span>
      </div>
      <div id="rules-body" class="hidden"></div>
    </div>
  `));
  document.getElementById('go-online').onclick = renderOnlineEntry;
  document.getElementById('go-hotseat').onclick = renderHotseatSetup;
  document.getElementById('toggle-rules').onclick=(e)=>{
    const b=document.getElementById('rules-body');
    if(b.classList.contains('hidden')){ b.classList.remove('hidden'); b.innerHTML=rulesHtml(); e.target.textContent='閉じる'; }
    else{ b.classList.add('hidden'); e.target.textContent='ルール・役職を見る'; }
  };
}
function rulesHtml(){
  return `
    <h4>役職</h4>
    国民3人：危機カード18枚をすべて処理し、危機ゲージが上限未満なら勝利。<br>
    裏切り者1人：危機ゲージを上限まで上げれば勝利。正体は最後まで隠されます。
    <h4>危機カードと必要資源</h4>
    <table><tr><th>危機</th><th>必要資源</th><th>枚数</th></tr>
    <tr><td>戦争</td><td>石油2</td><td>5</td></tr>
    <tr><td>干ばつ</td><td>水2</td><td>4</td></tr>
    <tr><td>飢饉</td><td>食料2</td><td>4</td></tr>
    <tr><td>インフラ崩壊</td><td>鉄2</td><td>3</td></tr>
    <tr><td>国家非常事態</td><td>任意の資源4枚</td><td>2</td></tr>
    </table>
    <h4>ラウンドの流れ</h4>
    危機発生→相談（自由・ブラフ可、自分の手札を見ながら話せます）→各自伏せて提出→公開→貿易（公開カード2枚→任意の資源1枚。何度でも可）→判定→補充（提出0枚の人だけ、複数いれば手番から時計回りで一番近い人）。
    <p class="small">貿易で消費した2枚は消滅し、新しい1枚が生まれます（合計は1枚減ります）。判定に使われなかった公開カードは補充山札へ戻ります。</p>
    <h4>危機ゲージの上限について</h4>
    <p class="small">仕様上の初期値は5ですが、シミュレーションでは国民側がほぼ確実に負けることが分かっています。10〜12程度に上げると勝負らしくなります。ゲーム開始時に調整できます。</p>
  `;
}
function gaugeMaxPicker(containerId, hintId){
  return el(`<div style="margin:10px 0;"><label>危機ゲージの上限（この数値に到達で裏切り者勝利）</label><div class="row" id="${containerId}"></div><div class="small muted" id="${hintId}" style="margin-top:4px;"></div></div>`);
}
function wireGaugeMaxPicker(containerId, hintId, onChange){
  const options=[3,5,8,10,12,15];
  let current = 10;
  const box = document.getElementById(containerId);
  function renderOpts(){
    box.innerHTML='';
    options.forEach(v=>{
      const b = el(`<button class="btn small ${v===current?'selected':''}">${v}</button>`);
      b.onclick = ()=>{ current=v; renderOpts(); onChange(current); updateHint(); };
      box.appendChild(b);
    });
  }
  function updateHint(){
    const hint = document.getElementById(hintId);
    if(!hint) return;
    if(current<=4) hint.textContent='超高難易度。裏切り者がかなり有利です。';
    else if(current===5) hint.textContent='仕様書どおりの初期値。国民側にはかなり厳しい難易度です。';
    else if(current<10) hint.textContent='まだ国民側が不利な設定です。';
    else if(current<=12) hint.textContent='シミュレーション上、勝負らしくなる目安の設定です。';
    else hint.textContent='国民側がかなり有利になる設定です。';
  }
  renderOpts(); updateHint(); onChange(current);
  return ()=>current;
}

function renderRoleGateHotseat(){

function renderRoundLoopHotseat(){

    replay:()=>{ const names=s.players.map(p=>p.name); App.gs=Game2.newGame(names, s.gaugeMax); App.roleGateIdx=0; App.roleAcked=[false,false,false,false]; renderRoleGateHotseat(); },
    exit: renderStart
  }); return; }
  if(s.phase==='crisis_reveal') return renderCrisisRevealHotseat();
  if(s.phase==='discussion') return renderDiscussionHotseat();
  if(s.phase==='submission') return renderSubmissionHotseat();
  if(s.phase==='reveal') return renderRevealHotseat();

function resTile(type, opts){

function renderTradeHotseat(){

  App.tradeSel = App.tradeSel||[];

  const rw = el(`<div class="res-wrap"></div>`);
  s.field.forEach(c=>{

      pick.appendChild(b);

  }
  const doneBtn = el(`<button class="btn primary block" style="margin-top:14px;">貿易を終えて判定へ</button>`);

  root.appendChild(wrap);

function renderJudgmentHotseat(){
  const s=App.gs;
  const req = s.currentCrisis;
  const canNow = Game2.canSucceed(s);
  App.judgeSel = App.judgeSel||[];
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(s));
  wrap.appendChild(crisisPanel(s));
  const card = el(`<div class="card"></div>`);
  if(!canNow){
    card.appendChild(el(`<div class="result-banner traitor" style="font-size:1.4rem;">解決失敗</div>`));
    card.appendChild(el(`<div class="small muted center">必要な資源が揃いませんでした。危機ゲージが+1されます。</div>`));
    const btn = el(`<button class="btn primary block" style="margin-top:12px;">確定して次のラウンドへ</button>`);
    btn.onclick=()=>{ App.gs = Game2.resolveFailure(App.gs); renderRoundLoopHotseat(); };
    card.appendChild(btn);
  } else {
    const need = req.reqAmount;
    card.appendChild(el(`<div class="small muted" style="margin-bottom:8px;">解決に使うカードを <span class="pick-counter">${req.reqType==='any'?'合計'+need+'枚':RESOURCE_LABEL[req.reqType]+' '+need+'枚'}</span> ちょうど選んでください。（<span class="pick-counter">${App.judgeSel.length}/${need}</span> 選択中）</div>`));
    const rw = el(`<div class="res-wrap"></div>`);
    s.field.forEach(c=>{
      const eligible = (req.reqType==='any') || (c.type===req.reqType);
      const selected = App.judgeSel.includes(c.id);
      const t = resTile(c.type, {selected, traded:c.traded, onClick: eligible? ()=>{
        if(selected){ App.judgeSel = App.judgeSel.filter(x=>x!==c.id); renderJudgmentHotseat(); return; }
        if(App.judgeSel.length>=need) return;
        App.judgeSel.push(c.id);
        renderJudgmentHotseat();
      } : null});
      if(!eligible) t.style.opacity = '.35';
      rw.appendChild(t);
    });
    card.appendChild(rw);
    const btn = el(`<button class="btn ok block" style="margin-top:12px;">この内容で解決する</button>`);
    btn.disabled = App.judgeSel.length!==need;
    btn.onclick = ()=>{ App.gs = Game2.resolveSuccess(App.gs, App.judgeSel); App.judgeSel=[]; renderRoundLoopHotseat(); };
    card.appendChild(btn);
  }
  wrap.appendChild(card);
  const log = el(`<div class="log-box"></div>`);
  s.log.slice(-8).forEach(m=> log.appendChild(el(`<div>・${escapeHtml(m)}</div>`)));
  wrap.appendChild(log);
  root.appendChild(wrap);
}

function setOnlineError(msg){ const n=document.getElementById('online-error'); if(n) n.textContent=msg; }
function randomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
async function createRoom(gaugeMax){
  for(let attempt=0; attempt<5; attempt++){
    const code = randomCode();
    const ref = db.collection(CRISIS_COLLECTION).doc(code);
    try{
      await db.runTransaction(async (tx)=>{
        const snap = await tx.get(ref);
        if(snap.exists) throw new Error('exists');
        const seats = [{uid:App.myUid, name:App.myName}, null, null, null];
        tx.set(ref, {
          status:'waiting',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          gaugeMax,
          seats,
          game: null
        });
      });
      App.roomCode = code;
      subscribeRoom(code);
      return;
    }catch(e){ if(e.message==='exists') continue; throw e; }
  }
  throw new Error('ルームコードの発行に失敗しました。もう一度お試しください。');
}
async function joinRoom(code){
  const ref = db.collection(CRISIS_COLLECTION).doc(code);
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    if(!snap.exists) throw new Error('そのルームコードは見つかりません。');
    const data = snap.data();
    if(data.status!=='waiting') throw new Error('このルームはすでに開始しています。');
    const seats = data.seats.slice();
    const already = seats.findIndex(s=>s && s.uid===App.myUid);
    if(already<0){
      const idx = seats.findIndex(s=>s===null);
      if(idx<0) throw new Error('ルームは満席（4人）です。');
      seats[idx] = {uid:App.myUid, name:App.myName};
    }
    tx.update(ref, {seats});
  });
  App.roomCode = code;
  subscribeRoom(code);
}
function subscribeRoom(code){
  if(App.roomUnsub) App.roomUnsub();
  const ref = db.collection(CRISIS_COLLECTION).doc(code);
  App.roomUnsub = ref.onSnapshot((snap)=>{
    if(!snap.exists){ renderOnlineError('ルームが見つかりません（削除された可能性があります）。'); return; }
    App.roomDoc = snap.data();
    App.mySeat = App.roomDoc.seats.findIndex(s=>s && s.uid===App.myUid);
    if(App.roomDoc.status==='waiting') renderOnlineLobby(code, ref);
    else renderOnlineGame(code, ref);
  }, (err)=>{
    console.error(err);
    renderOnlineError('通信エラーが発生しました: '+err.message+'（Firestoreのセキュリティルールをご確認ください）');
  });
}
function renderOnlineError(msg){
  root.innerHTML='';
  root.appendChild(el(`
    <div class="card center">
      <h2>エラー</h2>
      <p>${escapeHtml(msg)}</p>
      <button class="btn block" id="back">タイトルへ戻る</button>
    </div>
  `));
  document.getElementById('back').onclick = ()=>{ if(App.roomUnsub){ App.roomUnsub(); App.roomUnsub=null; } renderStart(); };
}
function renderOnlineLobby(code, ref){
  root.innerHTML='';
  const isHost = App.roomDoc.seats[0] && App.roomDoc.seats[0].uid===App.myUid;
  const filled = App.roomDoc.seats.filter(Boolean).length;
  const wrap = el(`<div class="card"></div>`);
  wrap.appendChild(el(`<h2>ルーム待機中</h2>`));
  wrap.appendChild(el(`<div class="room-code">${code}</div>`));
  wrap.appendChild(el(`<div class="center muted small" style="margin-bottom:10px;">このコードを他の3人に共有してください（4人揃うまで開始できません）</div>`));
  wrap.appendChild(el(`<div class="center small" style="margin-bottom:6px;">危機ゲージ上限: <b class="mono">${App.roomDoc.gaugeMax}</b></div>`));
  const list = el(`<div class="seat-list"></div>`);
  for(let i=0;i<4;i++){
    const s = App.roomDoc.seats[i];
    if(s) list.appendChild(el(`<div class="seat-item"><span>${escapeHtml(s.name)}${s.uid===App.myUid?'（あなた）':''}</span><span class="tag">席${i+1}</span></div>`));
    else list.appendChild(el(`<div class="seat-item empty"><span>空席</span><span class="tag">席${i+1}</span></div>`));
  }
  wrap.appendChild(list);
  if(isHost){
    const b = el(`<button class="btn primary block">ゲームを開始する</button>`);
    b.disabled = filled<4;
    if(filled<4) b.textContent = `4人揃うと開始できます（現在${filled}/4）`;
    b.onclick = async ()=>{ try{ await startOnlineGame(ref); }catch(e){ console.error(e); addLobbyError(wrap, e.message); } };
    wrap.appendChild(b);
  } else {
    wrap.appendChild(el(`<div class="muted small center">ホストがゲームを開始するのをお待ちください…（${filled}/4人）</div>`));
  }
  const leave = el(`<button class="btn block">ルームを出る</button>`);
  leave.onclick = ()=>{ if(App.roomUnsub){ App.roomUnsub(); App.roomUnsub=null; } renderStart(); };
  wrap.appendChild(leave);
  root.appendChild(wrap);
}
function addLobbyError(wrap, msg){ wrap.appendChild(el(`<div class="small" style="color:var(--alert);margin-top:8px;">${escapeHtml(msg)}</div>`)); }
async function startOnlineGame(ref){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    const data = snap.data();
    if(data.status!=='waiting') return;
    if(data.seats.some(s=>!s)) throw new Error('4人揃っていません。');
    const names = data.seats.map(s=>s.name);
    const state = Game2.newGame(names, data.gaugeMax || 10);
    tx.update(ref, {status:'playing', game:state});
  });
}
function renderOnlineGame(code, ref){
  const state = App.roomDoc.game;
  const mySeat = App.mySeat;
  if(mySeat<0){
    root.innerHTML='';
    root.appendChild(el(`<div class="card center"><h2>観戦中</h2><p class="muted small">このルームの席にはいません。</p></div>`));
    return;
  }
  if(state.phase==='gameover'){
    renderGameOver(state, {
      replay: async ()=>{ try{ await restartOnlineGame(ref, state); }catch(e){ console.error(e); } },
      exit: ()=>{ if(App.roomUnsub){ App.roomUnsub(); App.roomUnsub=null; } renderStart(); }
    });
    return;
  }
  if(state.phase==='crisis_reveal') return renderCrisisRevealOnline(state, ref, mySeat);
  if(state.phase==='discussion') return renderDiscussionOnline(state, ref, mySeat);
  if(state.phase==='submission') return renderSubmissionOnline(state, ref, mySeat);
  if(state.phase==='reveal') return renderRevealOnline(state, ref, mySeat);
  if(state.phase==='trade') return renderTradeOnline(state, ref, mySeat);
  if(state.phase==='judgment') return renderJudgmentOnline(state, ref, mySeat);
}
async function restartOnlineGame(ref, prevState){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    const data = snap.data();
    const names = prevState.players.map(p=>p.name);
    const state = Game2.newGame(names, data.gaugeMax || 10);
    tx.update(ref, {status:'playing', game:state});
  });
}
async function onlineAction(ref, fn){
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      const data = snap.data();
      if(data.status!=='playing') return;
      const newState = fn(data.game);
      tx.update(ref, {game:newState});
    });
  }catch(e){ console.error('action failed', e); }
}
function renderCrisisRevealOnline(state, ref, mySeat){
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(state));
  wrap.appendChild(crisisPanel(state));
  wrap.appendChild(roleBadge(state, mySeat));
  wrap.appendChild(handPanel(state, mySeat));
  wrap.appendChild(el(`<div class="card"><p class="small muted">危機が発生しました。ボイスチャットなどで自由に話し合ってください（ブラフも可）。自分の手札は上に表示されています。</p><button class="btn primary block" id="next">話し合いを始める</button></div>`));
  root.appendChild(wrap);
  document.getElementById('next').onclick = ()=> onlineAction(ref, s=>Game2.advanceToDiscussion(s));
}
function renderDiscussionOnline(state, ref, mySeat){
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(state));
  wrap.appendChild(crisisPanel(state));
  wrap.appendChild(roleBadge(state, mySeat));
  wrap.appendChild(handPanel(state, mySeat));
  wrap.appendChild(el(`<div class="card"><p class="small muted">相談タイム中です。準備ができたら誰かが次に進めてください。</p><button class="btn primary block" id="next">提出へ進む</button></div>`));
  root.appendChild(wrap);
  document.getElementById('next').onclick = ()=> onlineAction(ref, s=>Game2.advanceToSubmission(s));
}
function renderSubmissionOnline(state, ref, mySeat){
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(state));
  wrap.appendChild(crisisPanel(state));
  wrap.appendChild(roleBadge(state, mySeat));
  const already = !!state.submissions[mySeat];
  const submittedSeats = state.players.map(p=>p.id).filter(id=>state.submissions[id]);
  wrap.appendChild(el(`<div class="card small muted">提出済み: ${submittedSeats.length} / 4人</div>`));
  if(already){
    wrap.appendChild(el(`<div class="card center small muted">提出済みです。他のプレイヤーの提出を待っています…</div>`));
  } else {
    App.subSel = App.subSel||[];
    const you = handPanel(state, mySeat, {
      selectable:true, selected:App.subSel,
      onToggle:(id)=>{ if(App.subSel.includes(id)) App.subSel=App.subSel.filter(x=>x!==id); else App.subSel.push(id); renderSubmissionOnline(state, ref, mySeat); }
    });
    you.querySelector('.htitle').textContent = 'あなたの手札（提出するカードをタップで選択。0枚でもOK）';
    const btn = el(`<button class="btn primary block">この内容で提出する（${App.subSel.length}枚）</button>`);
    btn.onclick = async ()=>{
      const ids = App.subSel.slice();
      App.subSel=[];
      await onlineAction(ref, s=>Game2.submitCards(s, mySeat, ids));
    };
    you.appendChild(btn);
    wrap.appendChild(you);
  }
  root.appendChild(wrap);
}
function renderRevealOnline(state, ref, mySeat){
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(state));
  wrap.appendChild(crisisPanel(state));
  wrap.appendChild(roleBadge(state, mySeat));
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<h3 class="small" style="color:var(--amber);">提出カード公開</h3>`));
  state.players.forEach(p=>{
    const mine = state.field.filter(c=>c.ownerId===p.id);
    const g = el(`<div class="owner-group"></div>`);
    g.appendChild(el(`<div class="oname">${escapeHtml(p.name)}${p.id===mySeat?'（あなた）':''}（${mine.length}枚）</div>`));
    const rw = el(`<div class="res-wrap"></div>`);
    mine.forEach(c=> rw.appendChild(resTile(c.type,{small:true})));
    g.appendChild(rw);
    card.appendChild(g);
  });
  const btn = el(`<button class="btn primary block">貿易へ進む</button>`);
  btn.onclick = ()=> onlineAction(ref, s=>Game2.advanceToTrade(s));
  card.appendChild(btn);
  wrap.appendChild(card);
  root.appendChild(wrap);
}
function renderTradeOnline(state, ref, mySeat){
  App.tradeSel = App.tradeSel||[];
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(state));
  wrap.appendChild(crisisPanel(state));
  wrap.appendChild(roleBadge(state, mySeat));
  const card = el(`<div class="card"></div>`);
  const canNow = Game2.canSucceed(state);
  card.appendChild(el(`<div class="small" style="margin-bottom:8px;">現在の場: <b style="color:${canNow?'var(--ok)':'var(--alert-bright)'}">${canNow?'解決可能':'まだ足りません'}</b></div>`));
  card.appendChild(el(`<div class="small muted" style="margin-bottom:6px;">公開カードから2枚を選んで交換できます（何度でも可、全員が操作できます）。</div>`));
  const rw = el(`<div class="res-wrap"></div>`);
  state.field.forEach(c=>{
    const selected = App.tradeSel.includes(c.id);
    rw.appendChild(resTile(c.type, {selected, traded:c.traded, onClick:()=>{
      if(selected){ App.tradeSel = App.tradeSel.filter(x=>x!==c.id); renderTradeOnline(state, ref, mySeat); return; }
      if(App.tradeSel.length>=2) return;
      App.tradeSel.push(c.id);
      renderTradeOnline(state, ref, mySeat);
    }}));
  });
  card.appendChild(rw);
  if(App.tradeSel.length===2){
    const pick = el(`<div class="row" style="margin-top:10px;"></div>`);
    pick.appendChild(el(`<div class="small muted" style="width:100%;">交換後の資源を選択:</div>`));
    RESOURCE_TYPES.forEach(t=>{
      const b = el(`<button class="btn">${RESOURCE_LABEL[t]}</button>`);
      b.onclick = async ()=>{
        const ids = App.tradeSel.slice(); App.tradeSel=[];
        await onlineAction(ref, s=>Game2.doTrade(s, ids[0], ids[1], t));
      };
      pick.appendChild(b);
    });
    card.appendChild(pick);
  }
  const doneBtn = el(`<button class="btn primary block" style="margin-top:14px;">貿易を終えて判定へ</button>`);
  doneBtn.onclick = ()=>{ App.tradeSel=[]; onlineAction(ref, s=>Game2.advanceToJudgment(s)); };
  card.appendChild(doneBtn);
  wrap.appendChild(card);
  root.appendChild(wrap);
}
function renderJudgmentOnline(state, ref, mySeat){
  const req = state.currentCrisis;
  const canNow = Game2.canSucceed(state);
  App.judgeSel = App.judgeSel||[];
  root.innerHTML='';
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderStatusBar(state));
  wrap.appendChild(crisisPanel(state));
  wrap.appendChild(roleBadge(state, mySeat));
  const card = el(`<div class="card"></div>`);
  if(!canNow){
    card.appendChild(el(`<div class="result-banner traitor" style="font-size:1.4rem;">解決失敗</div>`));
    card.appendChild(el(`<div class="small muted center">必要な資源が揃いませんでした。危機ゲージが+1されます。</div>`));
    const btn = el(`<button class="btn primary block" style="margin-top:12px;">確定して次のラウンドへ</button>`);
    btn.onclick=()=> onlineAction(ref, s=>Game2.resolveFailure(s));
    card.appendChild(btn);
  } else {
    const need = req.reqAmount;
    card.appendChild(el(`<div class="small muted" style="margin-bottom:8px;">解決に使うカードを <span class="pick-counter">${req.reqType==='any'?'合計'+need+'枚':RESOURCE_LABEL[req.reqType]+' '+need+'枚'}</span> ちょうど選んでください。（<span class="pick-counter">${App.judgeSel.length}/${need}</span> 選択中）</div>`));
    const rw = el(`<div class="res-wrap"></div>`);
    state.field.forEach(c=>{
      const eligible = (req.reqType==='any') || (c.type===req.reqType);
      const selected = App.judgeSel.includes(c.id);
      const t = resTile(c.type, {selected, traded:c.traded, onClick: eligible? ()=>{
        if(selected){ App.judgeSel = App.judgeSel.filter(x=>x!==c.id); renderJudgmentOnline(state, ref, mySeat); return; }
        if(App.judgeSel.length>=need) return;
        App.judgeSel.push(c.id);
        renderJudgmentOnline(state, ref, mySeat);
      } : null});
      if(!eligible) t.style.opacity='.35';
      rw.appendChild(t);
    });
    card.appendChild(rw);
    const btn = el(`<button class="btn ok block" style="margin-top:12px;">この内容で解決する</button>`);
    btn.disabled = App.judgeSel.length!==need;
    btn.onclick = ()=>{ const ids=App.judgeSel.slice(); App.judgeSel=[]; onlineAction(ref, s=>Game2.resolveSuccess(s, ids)); };
    card.appendChild(btn);
  }
  wrap.appendChild(card);
  const log = el(`<div class="log-box"></div>`);
  state.log.slice(-8).forEach(m=> log.appendChild(el(`<div>・${escapeHtml(m)}</div>`)));
  wrap.appendChild(log);
  root.appendChild(wrap);
}

/* =====================================================================
   7. 起動
   ===================================================================== */
renderStart();
</script>
</body>
</html>
